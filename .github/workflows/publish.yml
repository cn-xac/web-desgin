# 发布工作流
#
# 触发：
#   - 推送 v* tag（如 v1.0.0）时自动执行「发布 npm + 部署示例到 Pages」
#   - 也支持在 Actions 页面手动 workflow_dispatch 触发
#
# 说明：
#   - 不用 scripts/release.mjs，直接 pnpm 发布当前 package.json 里的版本（即 latest）。
#   - 三个可发布包（@x-ac/design-core / @x-ac/design-vue / @x-ac/design-react）
#     走固定单版本组，永远共用一个版本号。
#   - 发布走 npm Trusted Publishing（OIDC）：**不需要 NPM_TOKEN**，GitHub Actions
#     用 OIDC 临时凭证直接发布，并生成「Built and signed with provenance」徽章。
#   - Pages 部署需要仓库开启 Settings → Pages → Source = GitHub Actions。
#
# 发布前置条件（一次性，在 npmjs.com 操作）：
#   1. 每个包：包设置 → Publishing access → Add a trusted publisher → GitHub Actions，
#      填 owner=cn-xac、repository=web-desgin、Workflow 文件名=publish.yml。
#   2. 三个包各自注册一次（monorepo 每个包独立）。
#   3. 每个包 package.json 需有 repository 字段（1.0.0 已补）。
#
# 重要前提：可信发布要求包已在 npm 存在且已注册 Trusted Publisher。
#   占位包已发、三包 Trusted Publisher 已配，故 1.0.0 即可直接 tokenless 发布。
#   若发布报 ENEEDAUTH，先核对 npmjs 的 Trusted Publisher 的 owner/repository/Workflow 文件名
#   是否与本仓库及本文件（publish.yml）完全一致。
#
# 技术约束：OIDC 要求 npm >= 11.5.1，故 publish job 用 node-version: 24；
#   setup-node 不写 registry-url（避免 .npmrc 与 OIDC 冲突）；
#   本工作流已声明 `id-token: write`（见 permissions），且运行于官方 runner。
#
# 注意：本工作流只负责「构建 + 发布 + 部署」，不建 tag、不 push。
# tag 由开发者本地按约定执行：git tag -s v1.0.0 -m "release 1.0.0" 后推送。

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish packages to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 直接构建三库（不调用 scripts/release.mjs）
      - name: Build libraries
        run: |
          pnpm --filter @x-ac/design-core build
          pnpm --filter @x-ac/design-vue build
          pnpm --filter @x-ac/design-react build

      - name: Test
        run: pnpm test

      # 直接 pnpm 发布：发布 packages/* 下所有非 private 包（当前即三个设计包）
      # tokenless OIDC：不配置 NPM_TOKEN，靠 id-token: write + --provenance 完成发布与溯源证明。
      - name: Publish to npm
        run: pnpm -r --filter "./packages/*" publish --access public --no-git-checks --provenance

  deploy-examples:
    name: Build & deploy examples to GitHub Pages
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 两个示例各自独立构建：vue-example 在站点根，react-example 在 /react/
      - name: Build vue-example
        run: pnpm --filter vue-example build

      - name: Build react-example
        run: pnpm --filter react-example build

      - name: Stage Pages artifact
        run: |
          rm -rf .pages-stage
          mkdir -p .pages-stage/react
          cp -r apps/vue-example/dist/* .pages-stage/
          cp -r apps/react-example/dist/* .pages-stage/react/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-stage

      - id: deployment
        uses: actions/deploy-pages@v4
